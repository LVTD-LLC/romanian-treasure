name: Verify and publish review preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: case-file-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run check:data
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/

  preview:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the temporary GitHub Pages review site
        id: deployment
        uses: actions/deploy-pages@v4
